name: Build Windows app
on:
  push:
    branches: [main]
    paths:
      - 'windows_app.py'
      - 'build_windows.py'
      - 'requirements-windows.txt'
      - 'Install-Windows.*'
      - 'test_windows.py'
      - 'index.html'
      - 'save_core.py'
      - 'server.py'
      - 'backup_storage.py'
      - 'test_backups.py'
      - 'catalog.json'
      - 'Info.plist'
      - '.github/workflows/windows.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements-windows.txt
      - name: Test desktop file operations
        run: python -m unittest test_windows.py test_backups.py -v
      - name: Build Windows executable
        run: python build_windows.py
      - name: Smoke-test the bundled executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\Dead Island 2 Workshop\Dead Island 2 Workshop.exe' -ArgumentList '--self-test', "$pwd\windows-smoke.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Executable self-test failed: $($p.ExitCode)" }
          if (-not (Test-Path windows-smoke.json)) { throw 'Executable did not produce its self-test result.' }
          Get-Content windows-smoke.json
      - name: Publish Windows release downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from windows_app import version; print(version())"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target "$env:GITHUB_SHA" --title "Workshop $version - Mac and Windows" --notes "Windows preview built by GitHub Actions. Extract the complete Windows ZIP and run Install-Windows.cmd, or run the executable from its folder. Mac installers remain in the repository downloads folder. See README.md and USER_GUIDE.md. Save Wizard or a compatible external PS4 container workflow is still required."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          $assets = @((Get-ChildItem windows-dist/*.zip).FullName) + @((Resolve-Path windows-dist/WINDOWS-SHA256SUMS.txt).Path)
          gh release upload $tag @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload release downloads.' }
